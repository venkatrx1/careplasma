name = "careplasma-mailer"
main = "index.js"
compatibility_date = "2026-01-01"

# Plain (non-secret) variables — safe to commit.
# Set RESEND_API_KEY separately as a secret (see README.md); never put it here.
# NOTE: if this is deployed as a Cloudflare Pages project (careplasmamailer.pages.dev)
# via Git integration rather than `wrangler deploy`/`wrangler pages deploy`, these vars
# and the RESEND_API_KEY secret must instead be set in the Pages project's dashboard
# under Settings > Environment variables — this file is not read in that flow.
[vars]
TO_EMAIL = "info@careplasma.com, venkatrx1@gmail.com"
FROM_EMAIL = "onboarding@resend.dev"
ALLOWED_ORIGIN = "*"
